<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>Count — Tap Counter</title>
<style>
:root{color-scheme:dark;--bg:#0b1020;--muted:#9aa8c1;--line:rgba(255,255,255,.12);--accent:#7c9cff}
*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%}
body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(ellipse at top,#1a2850 0%,var(--bg) 58%);color:#f8fafc;-webkit-tap-highlight-color:transparent}
.app{min-height:100svh;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(16px + env(safe-area-inset-top)) 20px 16px;border-bottom:1px solid var(--line);background:rgba(11,16,32,.55)}
.brand{font-weight:750;letter-spacing:.04em;font-size:1.05rem}.menu{display:flex;gap:8px}
button{font:inherit;cursor:pointer;touch-action:manipulation;color:#e8edff;background:#202b45;border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:.9rem;font-weight:650}
button:active{transform:scale(.97)}button:focus-visible{outline:3px solid #93c5fd;outline-offset:2px}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;user-select:none;-webkit-user-select:none;cursor:pointer;outline:none;touch-action:manipulation}
.counter{display:flex;flex-direction:column;align-items:center;gap:14px;pointer-events:none}
.number{font-size:clamp(6rem,25vw,13rem);font-weight:750;letter-spacing:-.075em;line-height:1;font-variant-numeric:tabular-nums;overflow-wrap:anywhere;max-width:100%}
.hint{color:var(--muted);font-size:1rem}.tap-pill{margin-top:8px;border:1px solid rgba(124,156,255,.38);border-radius:999px;padding:9px 15px;color:#c7d5ff;background:rgba(124,156,255,.09);font-size:.85rem}
footer{text-align:center;padding:14px 20px calc(18px + env(safe-area-inset-bottom));color:#71809b;font-size:.78rem}
.flash{animation:pop .16s ease-out}@keyframes pop{50%{transform:scale(1.045)}}
@media(max-width:380px){header{padding-left:12px;padding-right:12px}.menu{gap:5px}button{padding:9px 10px}}
</style>
</head>
<body>
<div class="app">
<header><div class="brand">COUNT</div><nav class="menu" aria-label="Counter controls"><button id="decrement" type="button" aria-label="Decrement count">− Decrement</button><button id="reset" type="button">↺ Reset</button></nav></header>
<main id="tapArea" role="button" tabindex="0" aria-label="Tap anywhere here to increase the count"><div class="counter"><div class="number" id="number" aria-live="polite">0</div><div class="hint">Tap anywhere to count</div><div class="tap-pill">Every tap adds 1</div></div></main>
<footer>Your count is saved automatically on this device.</footer>
</div>
<script>
const number=document.getElementById('number'),tapArea=document.getElementById('tapArea');
let count=0;
try{count=Math.max(0,Number(localStorage.getItem('count-value'))||0)}catch(_){}
function render(){number.textContent=count.toLocaleString();number.classList.remove('flash');void number.offsetWidth;number.classList.add('flash');try{localStorage.setItem('count-value',String(count))}catch(_){}}
function increment(){count+=1;render()}
tapArea.addEventListener('click',increment);
tapArea.addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();increment()}});
document.getElementById('decrement').addEventListener('click',()=>{count=Math.max(0,count-1);render()});
document.getElementById('reset').addEventListener('click',()=>{count=0;render()});
render();
</script>
</body>
</html>
